[package]
name = "alight"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
smol = { workspace = true }
async-channel = { workspace = true }
encoding_rs = { workspace = true }
crc = { workspace = true }

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Storage_IscsiDisc"] }